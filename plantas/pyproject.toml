[project]
name = "plantas"
version = "0.1.0"
description = "Tools that redraw the MSC Virtuosa deck plans and build the GPS route data (see README.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "shapely>=2.0",
  "rapidfuzz>=3.9",
  "rapidocr-onnxruntime>=1.3.24",
]
